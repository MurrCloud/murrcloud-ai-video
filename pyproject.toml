[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "murrcloud-ai-video-studio"
version = "0.5.0"
description = "Isolated internal AI video production platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.3,<1",
  "redis>=6,<8",
  "celery[redis]>=5.6,<6",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7.1,<1",
  "pillow>=13.0,<14",
  "edge-tts>=7.3.1,<8",
  "boto3>=1.43,<2",
  "cryptography>=50,<51",
]

[project.urls]
Repository = "https://github.com/gcenterprises/murrcloud-ai-video"
Issues = "https://github.com/gcenterprises/murrcloud-ai-video/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/backend"]
markers = ["integration: requires isolated PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
