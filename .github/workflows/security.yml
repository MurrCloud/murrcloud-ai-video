name: Source security checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version
      - name: Scan all fetched source history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --no-banner --log-opts=--all

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tools only
        run: python -m pip install --disable-pip-version-check --no-input pip-audit==2.10.1 uv==0.11.17
      - name: Check the canonical lock and exported requirements agree
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv export --frozen --no-emit-project --no-dev --no-header --format requirements.txt \
            > "$RUNNER_TEMP/requirements.lock"
          uv export --frozen --no-emit-project --no-header --format requirements.txt \
            > "$RUNNER_TEMP/requirements-dev.lock"
          for lock in requirements.lock requirements-dev.lock; do
            diff -u <(sed '/^[[:space:]]*#/d' "$lock") \
              <(sed '/^[[:space:]]*#/d' "$RUNNER_TEMP/$lock")
          done
      - name: Audit pinned runtime and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          for lock in requirements.lock requirements-dev.lock; do
            python -m pip_audit --strict --disable-pip --require-hashes \
              --progress-spinner off --requirement "$lock"
          done

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit the exact frontend lock without running package scripts
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low
