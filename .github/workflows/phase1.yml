name: Studio isolated acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:infrastructure/docker/compose.test.yml
      COMPOSE_PROJECT_NAME: murrcloud-video-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate ephemeral dedicated credentials
        shell: bash
        run: |
          set -euo pipefail
          db_secret=$(openssl rand -hex 32)
          cache_secret=$(openssl rand -hex 32)
          session_secret=$(openssl rand -hex 32)
          provider_master=$(python3 -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$db_secret"
          echo "::add-mask::$cache_secret"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$provider_master"
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$db_secret"
            printf 'REDIS_PASSWORD=%s\n' "$cache_secret"
            printf 'VIDEO_SESSION_SECRET=%s\n' "$session_secret"
            printf 'VIDEO_PROVIDER_KEY_ENCRYPTION_KEY=%s\n' "$provider_master"
            printf 'VIDEO_DATABASE_URL=postgresql+psycopg://video:%s@postgres:5432/video_studio\n' "$db_secret"
            printf 'VIDEO_TEST_DATABASE_URL=postgresql+psycopg://video:%s@postgres:5432/video_studio_test\n' "$db_secret"
            printf 'VIDEO_TEST_REDIS_URL=redis://:%s@redis:6379/1\n' "$cache_secret"
            printf 'VIDEO_REDIS_URL=redis://:%s@redis:6379/0\n' "$cache_secret"
          } >> "$GITHUB_ENV"
      - name: Validate and build isolated images
        run: |
          docker compose --profile test --profile ui config --quiet
          docker compose --profile test build api tests rendering-worker
      - name: Start dedicated data services
        run: |
          docker compose up -d --wait postgres redis
          docker compose exec -T postgres sh -ec 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U video -d video_studio -c "CREATE DATABASE video_studio_test"'
      - name: Verify explicit migration lifecycle
        run: |
          docker compose run --rm --no-deps api alembic -c apps/backend/alembic.ini upgrade head
          docker compose run --rm --no-deps api alembic -c apps/backend/alembic.ini check
          docker compose run --rm --no-deps api alembic -c apps/backend/alembic.ini downgrade base
          docker compose run --rm --no-deps api alembic -c apps/backend/alembic.ini upgrade head
          docker compose run --rm --no-deps api python -m app.cli seed-models
          docker compose up -d --wait api generation-worker rendering-worker
      - name: Run unit, PostgreSQL, Redis and live API tests
        run: |
          docker compose --profile test run --rm --no-deps tests ruff check --no-cache .
          docker compose --profile test run --rm --no-deps tests ruff format --check --no-cache .
          bash -n scripts/assess-vps.sh scripts/backup.sh
          docker compose --profile test run --rm --no-deps -e VIDEO_TEST_FRONTEND_URL= tests
      - name: Verify frontend tests, types and production image
        run: |
          docker compose --profile ui build frontend
          docker compose up -d --wait frontend
          docker compose --profile test run --rm --no-deps tests python -m pytest -q -p no:cacheprovider tests/test_live_runtime.py tests/test_live_planning.py tests/test_live_production.py tests/test_live_workspace.py tests/test_live_provider_keys.py
      - name: Assert actual container isolation and limits
        run: python3 scripts/assert-container-isolation.py
      - name: Verify restart and dependency failure behavior
        run: |
          docker compose restart api
          docker compose up -d --wait api
          docker compose --profile test run --rm --no-deps tests python -m pytest -q -p no:cacheprovider tests/test_live_runtime.py tests/test_live_planning.py tests/test_live_production.py tests/test_live_workspace.py tests/test_live_provider_keys.py
          docker compose stop redis
          docker compose exec -T api python -c "import urllib.request,urllib.error; r=urllib.request.urlopen('http://localhost:8100/health/live'); assert r.status==200; exec(\"try:\n urllib.request.urlopen('http://localhost:8100/health/ready')\nexcept urllib.error.HTTPError as e:\n assert e.code==503\nelse:\n raise AssertionError('Readiness failed open')\")"
      - name: Cleanup disposable stack
        if: always()
        run: docker compose --profile test --profile ui --profile workers down --volumes --remove-orphans
